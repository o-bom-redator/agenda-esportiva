# Todo dia às 5h (Brasília) gera as imagens da agenda e publica numa release do dia.
# A release aparece em github.com/<usuario>/<repo>/releases e o GitHub avisa por e-mail/app.
# Também publica a página com os links "Salvar no Google Agenda" (se o GitHub Pages estiver ligado).
name: Agenda do dia

on:
  schedule:
    - cron: '0 8 * * *' # 8h UTC = 5h em Brasília (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      data:
        description: 'Dia: hoje, amanha ou AAAA-MM-DD'
        default: hoje

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pagina: ${{ steps.pages.outputs.ligado }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fontes (emojis)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji

      - name: Instalar dependências
        run: npm ci

      - name: Definir data
        run: |
          ENTRADA="${{ github.event.inputs.data || 'hoje' }}"
          case "$ENTRADA" in
            hoje) DATA=$(TZ=America/Sao_Paulo date +%F) ;;
            amanha) DATA=$(TZ=America/Sao_Paulo date -d tomorrow +%F) ;;
            *) DATA="$ENTRADA" ;;
          esac
          echo "DATA=$DATA" >> "$GITHUB_ENV"

      - name: Gerar imagens
        run: node gerar.js --data "$DATA"
        env:
          # manda as imagens pro seu Telegram (pelo bot dos gols)
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Verificar se o GitHub Pages está ligado
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if URL=$(gh api "repos/${{ github.repository }}/pages" --jq .html_url 2>/dev/null); then
            echo "ligado=sim" >> "$GITHUB_OUTPUT"
            echo "PAGINA_URL=$URL" >> "$GITHUB_ENV"
          else
            echo "ligado=nao" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar página
        if: steps.pages.outputs.ligado == 'sim'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar release do dia
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="agenda-$DATA"
          PASTA="imagens/$DATA"
          gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true

          {
            echo "### $(sed -n 2p "$PASTA/mensagem.txt" | sed 's/^📅 _//; s/_$//')"
            echo
            if [ -n "$PAGINA_URL" ]; then
              echo "📅 **Página com os botões do Google Agenda:** $PAGINA_URL"
              echo
            fi
            for f in "$PASTA"/*.png; do
              echo "![$(basename "$f")](https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename "$f"))"
            done
            echo
            echo "<details><summary>Versão em texto</summary>"
            echo
            echo '```'
            cat "$PASTA/mensagem.txt"
            echo '```'
            echo "</details>"
          } > notas.md

          gh release create "$TAG" "$PASTA"/*.png "$PASTA/mensagem.txt" \
            --title "Agenda $(TZ=UTC date -d "$DATA" +%d/%m)" --notes-file notas.md --latest

      - name: Apagar releases de dias que já passaram
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LIMITE=$(TZ=America/Sao_Paulo date +%F)
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^agenda-' | while read -r TAG; do
            [[ "${TAG#agenda-}" < "$LIMITE" ]] && gh release delete "$TAG" --cleanup-tag -y || true
          done

  # Publica a página no GitHub Pages (só roda quando o Pages está ligado no repositório)
  pagina:
    needs: agenda
    if: needs.agenda.outputs.pagina == 'sim'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
