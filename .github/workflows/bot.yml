name: Bot de gols e avisos

# O bot fica ligado o dia todo, em turnos de até 6 h (limite do GitHub) que acabam
# às 2h, 8h, 14h e 20h (Brasília). O turno seguinte já está na fila e assume na hora.
on:
  schedule:
    # De hora em hora, fora da hora cheia: o agendamento do GitHub atrasa ou pula execuções.
    # Com o bot já ligado, a nova execução fica na fila e assume quando o turno atual acaba,
    # então sempre tem um bot rodando (sem buraco de madrugada).
    - cron: '17 * * * *'
  workflow_dispatch:

# Só um bot por vez: se um turno atrasar, o próximo espera ele terminar.
concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true' # o bot não usa o Chrome

      # Lista de jogos já avisados (pra não repetir aviso quando o turno troca)
      - name: Recuperar avisos já enviados
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: bot-estado-${{ github.run_id }}
          restore-keys: bot-estado-

      - name: Rodar o bot
        run: mkdir -p estado && node bot.js
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PARAR_AS: '5,11,17,23'

      - name: Guardar avisos enviados
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado
          key: bot-estado-${{ github.run_id }}
